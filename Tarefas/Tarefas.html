<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Tarefas.css">
    <title>tarefas</title>
</head>

<body>
    <header class="cabecalho">
        <h1>
            Tarefas
        </h1>
    </header>
    <div class="conteudo">
        <div class="main">
            <form>
                <label class="info">
                    Nova tarefa:
                </label><br>
                <input class="descricao" type="text" placeholder="Descreva sua tarefa"><br>
                <button id="botao">Adicionar Tarefa</button>
            </form>
            <br>
            <hr><br>
            <label class="info">
                Minhas tarefas:</label> <br><br>
            <input type="checkbox" id="Git">
            <label class="check" for="Git">Estudar Git.</label><br>

            <input type="checkbox" id="Exercicio">
            <label class="check" for="Exercicio">Fazer Exercicio.</label><br>

            <input type="checkbox" id="pull">
            <label class="check" for="pull">Revisar Pull Request.</label>

        </div>
    </div>
</body>

</html>
